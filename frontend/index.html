<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar & Wind Deployment Intelligence</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
</head>
<body>

 
  <div id="auth-view" class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <h1>Deployment Intelligence</h1>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Log In</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <form id="login-form" class="tab-panel active">
        <label>Email</label>
        <input type="email" id="login-email" required>
        <label>Password</label>
        <input type="password" id="login-password" required>
        <button type="submit" class="primary-btn">Log In</button>
      </form>

      <form id="register-form" class="tab-panel">
        <label>Full Name</label>
        <input type="text" id="reg-name" required>
        <label>Email</label>
        <input type="email" id="reg-email" required>
        <label>Password</label>
        <input type="password" id="reg-password" required minlength="6">
        <label>Role</label>
        <select id="reg-role">
          <option>Renewable Energy Planner</option>
          <option>GIS Analyst</option>
          <option>Project Manager</option>
          <option>Administrator</option>
        </select>
        <button type="submit" class="primary-btn">Create Account</button>
      </form>

      <p id="auth-error" class="error-msg"></p>
    </div>
  </div>

  
  <div id="app-view" class="app-wrap hidden">
    <aside class="sidebar">
      <div class="brand-mini">
        <span>Deployment Intelligence</span>
      </div>
      <nav>
        <button class="nav-btn active" data-view="dashboard">Overview</button>
        <button class="nav-btn" data-view="projects">Projects</button>
        <button class="nav-btn" data-view="new-site">Register New Site</button>
        <button class="nav-btn" data-view="sites">All Sites</button>
      </nav>
      <div class="user-box">
        <div class="user-name" id="user-name">—</div>
        <div class="user-role" id="user-role">—</div>
        <button id="logout-btn" class="ghost-btn">Log Out</button>
      </div>
    </aside>

    <main class="main">
     
      <section id="view-dashboard" class="view active">
        <h2>Project Overview</h2>
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="panel-grid">
          <div class="panel">
            <h3>Sites by Suitability Category</h3>
            <div id="category-bars"></div>
          </div>
          <div class="panel">
            <h3>Top Recommended Sites</h3>
            <div id="top-sites-list"></div>
          </div>
        </div>
      </section>

   
      <section id="view-projects" class="view">
        <h2>Projects</h2>
        <form id="project-form" class="analyze-form">
          <div class="form-grid">
            <div>
              <label>Project Name</label>
              <input type="text" id="p-name" required placeholder="e.g. Rajasthan Solar Portfolio">
            </div>
            <div>
              <label>Description (optional)</label>
              <input type="text" id="p-description">
            </div>
          </div>
          <button type="submit" class="primary-btn">Create Project</button>
        </form>
        <div id="projects-list"></div>
      </section>

    
      <section id="view-new-site" class="view">
        <div class="section-header">
          <h2 id="site-form-heading">Register New Site</h2>
          <button type="button" id="cancel-edit-btn" class="ghost-btn cancel-edit-btn hidden">Cancel Edit</button>
        </div>
        <form id="site-form" class="analyze-form">
          <div class="form-grid">
            <div>
              <label>Site Name</label>
              <input type="text" id="s-name" required placeholder="e.g. Jodhpur Solar Field A">
            </div>
            <div>
              <label>Assign to Project (optional)</label>
              <select id="s-project">
                <option value="">No Project (standalone site)</option>
              </select>
            </div>
          </div>
          <div class="form-grid">
            <div>
              <label>Region</label>
              <div class="region-search-row">
                <div class="region-input-wrap">
                  <input type="text" id="s-region" autocomplete="off">
                  <div id="region-suggestions" class="suggestions-dropdown hidden"></div>
                </div>
                <button type="button" id="locate-btn" class="ghost-btn locate-btn">Find on Map</button>
              </div>
            </div>
          </div>

          <div class="map-block">
            <div id="site-map"></div>
          </div>

          <div class="form-grid">
            <div>
              <label>Latitude</label>
              <input type="number" step="any" id="s-lat" required>
            </div>
            <div>
              <label>Longitude</label>
              <input type="number" step="any" id="s-lon" required>
            </div>
            <div>
              <label>Usable Land Area (m²)</label>
              <input type="number" step="any" id="s-area" required readonly>
            </div>
            <div>
              <label>Existing Infrastructure</label>
              <select id="s-infra">
                <option value="">None</option>
                <option value="Road Access">Road Access</option>
                <option value="Grid Connection">Grid Connection</option>
                <option value="Substation Nearby">Substation Nearby</option>
                <option value="Road + Grid Access">Road + Grid Access</option>
              </select>
            </div>
            <div>
              <label>Land Ownership</label>
              <select id="s-ownership">
                <option value="Private">Private</option>
                <option value="Government">Government</option>
                <option value="Community/Cooperative">Community/Cooperative</option>
              </select>
            </div>
          </div>
          <button type="submit" class="primary-btn" id="site-submit-btn">Register Site &amp; Run Resource Prediction</button>
        </form>
        <div id="site-result"></div>
      </section>

   
      <section id="view-sites" class="view">
        <div class="section-header">
          <h2>All Sites</h2>
          <button type="button" id="clear-site-filter-btn" class="ghost-btn cancel-edit-btn hidden">Show All Sites</button>
        </div>
        <div id="site-filter-banner"></div>
        <table class="sites-table">
          <thead>
            <tr>
              <th>Site Name</th><th>Project</th><th>Region</th><th>Score</th><th>Category</th><th>Tech</th><th>Created</th><th></th>
            </tr>
          </thead>
          <tbody id="sites-table-body"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="app.js"></script>
</body>
</html>
